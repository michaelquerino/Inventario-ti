name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest -v

      - name: Validar migração Alembic contra um banco novo (do zero)
        run: |
          rm -f /tmp/alembic-check.db
          DATABASE_URL="sqlite:////tmp/alembic-check.db" alembic upgrade head

  agent-tests:
    name: Agente/database.py (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # database.py só usa a biblioteca padrão do Python (sqlite3, os, sys,
      # logging, datetime) -- não precisa do requirements.txt completo do
      # agente (customtkinter etc. são só pra GUI/empacotamento, não fazem
      # sentido instalar num runner Linux headless).
      - name: Instalar pytest
        run: pip install pytest==8.3.3

      - name: Rodar testes
        run: pytest tests -v

  frontend-build:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # "npm run lint" (next lint) não está configurado neste projeto -- sem
      # um eslint config commitado, ele abre um wizard interativo pra criar
      # um na hora, o que trava em CI (não-interativo). O build do Next já
      # faz lint + checagem de tipos por conta própria (etapa "Linting and
      # checking validity of types" no log), então cobre o essencial mesmo
      # assim. Configurar o eslint.config.* direito fica pra outra hora.
      - name: Build
        run: npm run build

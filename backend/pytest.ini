[pytest]
# "app" não é um pacote instalado (não há pyproject.toml/setup.py no
# backend) -- funcionava rodando testes com `python -m pytest` (que insere o
# diretório atual em sys.path automaticamente), mas quebra com o comando
# `pytest` direto, que é como o CI chama (ModuleNotFoundError: No module
# named 'app'). `pythonpath` resolve isso pros dois jeitos de chamar, sem
# depender de instalar o backend como pacote.
pythonpath = .
